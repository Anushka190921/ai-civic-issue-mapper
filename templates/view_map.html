<!DOCTYPE html>
<html>
<head>
    <title>All Complaint Locations</title>

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <style>
        html,body{
            margin:0;
            padding:0;
        }

        #map{
            width:100%;
            height:100vh;
        }
    </style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

var map = L.map('map').setView([28.6139,77.2090],12);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
    attribution:'© OpenStreetMap'
}).addTo(map);

var complaints = {{ complaints|tojson }};

var bounds = [];

complaints.forEach(function(c){

    if(c.latitude && c.longitude){

        var marker=L.marker([
            parseFloat(c.latitude),
            parseFloat(c.longitude)
        ]).addTo(map);

        marker.bindPopup(
            "<b>Complaint ID :</b> "+c.id+
            "<br><b>Issue :</b> "+c.issue_type+
            "<br><b>Status :</b> "+c.status
        );

        bounds.push([
            parseFloat(c.latitude),
            parseFloat(c.longitude)
        ]);
    }

});

if(bounds.length>0){
    map.fitBounds(bounds);
}

</script>

</body>
</html>
