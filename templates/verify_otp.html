<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ t('verify_title') }} — Civic Issue Mapper</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --navy:#0B2545; --paper:#EDEFE8; --amber:#F2A93B; --amber-ink:#5C3A08; }
  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; background:var(--navy); color:var(--paper);
       font-family:'Noto Sans Devanagari', system-ui, sans-serif;
       display:flex; align-items:center; justify-content:center; padding:24px;}
  .card{width:100%; max-width:380px;}
  h1{margin:0 0 16px;}
  input[name=otp]{width:100%; padding:14px; font-size:24px; letter-spacing:8px; text-align:center;
       border:2px solid var(--amber); border-radius:8px; background:#fff; color:#000;}
  button{width:100%; margin-top:12px; padding:12px; border:0; border-radius:8px;
       background:var(--amber); color:var(--amber-ink); font-weight:700; font-size:16px; cursor:pointer;}
  .link-btn{background:transparent; color:var(--paper); text-decoration:underline; font-weight:400;}
  .msg{padding:10px 12px; border-radius:8px; margin-bottom:12px; font-size:14px;}
  .err{background:#7a1f1f;} .info{background:rgba(255,255,255,.1);}
  a{color:inherit;}
</style>
</head>
<body>
{% include '_lang_switcher.html' %}
<div class="card">
  <h1>{{ t('verify_title') }}</h1>
  {% if error %}<div class="msg err" role="alert">{{ error }}</div>{% endif %}
  {% if info %}<div class="msg info">{{ info }}</div>{% endif %}

  <form method="POST" action="/verify-otp">
    <label for="otp">{{ t('otp_label') }}</label>
    <input id="otp" name="otp" type="text" inputmode="numeric" pattern="[0-9]{6}"
           maxlength="6" autocomplete="one-time-code" required autofocus>
    <button type="submit">{{ t('verify_btn') }}</button>
  </form>

  <form method="POST" action="/resend-otp">
    <button type="submit" class="link-btn">{{ t('resend_otp') }}</button>
  </form>
</div>
</body>
</html>
